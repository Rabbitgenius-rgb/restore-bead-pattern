name: Bug report / 错误报告
description: Report a reproducible problem in restore, scale, revise, render, or mobile PDF generation.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove usernames, absolute paths, tokens, and private image or PDF content from logs before posting.
  - type: dropdown
    id: command
    attributes:
      label: Command
      options: [restore, scale, revise, render, mobile-pdf, installation, other]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS Apple Silicon, macOS Intel, Linux, Windows, other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Python, repository commit, and relevant NumPy/Pillow or pdfplumber/pypdf/ReportLab versions.
      placeholder: "Python 3.12; pdfplumber 0.11.9; pypdf 6.10.0; ReportLab 4.4.9; commit abc1234"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the command and smallest safe reproduction. Replace local paths with placeholders.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public data confirmation
      options:
        - label: I removed credentials, personal information, absolute paths, and private source pixels.
          required: true
        - label: Any attached image, PDF, or other material is mine to share or has a compatible public license.
          required: true
        - label: This is not a security vulnerability; security reports belong in the private advisory form.
          required: true
